name: Cloudflare Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

env:
  INDEXNOW_SITEMAP: .indexnow/sitemap.xml

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for Cloudflare Workers
        run: npx opennextjs-cloudflare build

      # Uploads only changed static assets, then publishes the new Worker version.
      - name: Deploy to Cloudflare Workers
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The sitemap from the last successful IndexNow submission, so only new or
      # changed URLs are sent (all of them when there is no previous record).
      - name: Restore last submitted sitemap
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.INDEXNOW_SITEMAP }}
          key: indexnow-sitemap-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-sitemap-

      # Notifies Bing (which also feeds ChatGPT search and Copilot), Yandex,
      # Seznam, Naver and Yep. Never fails the deploy.
      - name: Submit new and changed URLs to IndexNow
        id: indexnow
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs --previous "$INDEXNOW_SITEMAP" --save "$INDEXNOW_SITEMAP"

      - name: Remember submitted sitemap
        if: steps.indexnow.outcome == 'success' && hashFiles(env.INDEXNOW_SITEMAP) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.INDEXNOW_SITEMAP }}
          key: indexnow-sitemap-${{ github.run_id }}-${{ github.run_attempt }}
