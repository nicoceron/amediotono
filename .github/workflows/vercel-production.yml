name: Vercel Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  INDEXNOW_SITEMAP: .indexnow/sitemap.xml

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment information
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build production artifacts
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # --archive=tgz uploads the build as a few compressed parts instead of one
      # request per file: a Next.js output has thousands of files and the Hobby
      # plan allows 5,000 uploads per day.
      - name: Deploy production artifacts
        run: vercel deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # The sitemap from the last successful IndexNow submission, so only new or
      # changed URLs are sent (all of them when there is no previous record).
      - name: Restore last submitted sitemap
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.INDEXNOW_SITEMAP }}
          key: indexnow-sitemap-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-sitemap-

      # Notifies Bing (which also feeds ChatGPT search and Copilot), Yandex,
      # Seznam, Naver and Yep. Never fails the deploy.
      - name: Submit new and changed URLs to IndexNow
        id: indexnow
        continue-on-error: true
        run: node scripts/submit-indexnow.mjs --previous "$INDEXNOW_SITEMAP" --save "$INDEXNOW_SITEMAP"

      - name: Remember submitted sitemap
        if: steps.indexnow.outcome == 'success' && hashFiles(env.INDEXNOW_SITEMAP) != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ env.INDEXNOW_SITEMAP }}
          key: indexnow-sitemap-${{ github.run_id }}-${{ github.run_attempt }}
